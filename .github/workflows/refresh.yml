name: Refresh dashboard

on:
  schedule:
    # Daily at 03:00 UTC. Adjust as needed.
    - cron: '0 3 * * *'
  workflow_dispatch:

# Least-privilege: read-only on repo contents, write only what Pages requires.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time. Don't cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -q

      # Carry the daily open-issue snapshots across runs so the backlog trend
      # can accumulate. Rolling key: each run saves a new cache; restore-keys
      # pulls the most recent previous one (runners are ephemeral + the file is
      # gitignored, so without this the trend never has >=2 points).
      - name: Restore snapshot history
        uses: actions/cache@v4
        with:
          path: data/history.json
          key: history-${{ github.run_id }}
          restore-keys: |
            history-

      - name: Render dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m mediawg_dashboard.cli refresh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
